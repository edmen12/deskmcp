name: Feature request
description: Suggest an improvement to DeskMCP
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the user problem first. Security boundaries and local-first behavior should remain explicit.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should DeskMCP do instead?
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this change filesystem scope, process control, secrets, networking, or permission profiles?
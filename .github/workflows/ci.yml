name: CI

on:
  push:
    branches: [main, fix/arm64-installer-mutex-handshake]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gateway tests
        run: npm test

      - name: WPF build
        shell: powershell
        run: dotnet build .\control-panel\wpf\DeskMCP.ControlPanel.csproj -c Release --nologo -p:ContinuousIntegrationBuild=true

      - name: Update security self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\control-panel\wpf\bin\Release\net10.0-windows\DeskMCP.exe -ArgumentList '--update-security-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Update security self-test failed: $($p.ExitCode)" }

      - name: Runtime reliability self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\control-panel\wpf\bin\Release\net10.0-windows\DeskMCP.exe -ArgumentList '--runtime-reliability-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Runtime reliability self-test failed: $($p.ExitCode)" }

      - name: Installer UI build
        shell: powershell
        run: .\scripts\test-installer-ui.ps1

      - name: Build and smoke x64 installer
        shell: powershell
        run: .\scripts\build-installer.ps1 -Target win-x64

      - name: x64 release readiness
        shell: powershell
        run: .\scripts\check-release-readiness.ps1 -Target win-x64

      - name: Secret hygiene
        shell: powershell
        run: .\scripts\scan-release-secrets.ps1

  windows-arm64:
    name: Windows ARM64 release validation
    runs-on: windows-11-arm
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gateway tests
        run: npm test

      - name: Build and smoke ARM64 installer
        shell: powershell
        run: .\scripts\build-installer.ps1 -Target win-arm64

      - name: ARM64 update security self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\runtime\release-stage\win-arm64\DesktopMCP\DeskMCP.exe -ArgumentList '--update-security-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ARM64 update security self-test failed: $($p.ExitCode)" }

      - name: ARM64 runtime reliability self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\runtime\release-stage\win-arm64\DesktopMCP\DeskMCP.exe -ArgumentList '--runtime-reliability-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ARM64 runtime reliability self-test failed: $($p.ExitCode)" }

      - name: ARM64 release readiness
        shell: powershell
        run: .\scripts\check-release-readiness.ps1 -Target win-arm64

      - name: Secret hygiene
        shell: powershell
        run: .\scripts\scan-release-secrets.ps1

  macos-arm64-core:
    name: macOS ARM64 core validation
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify native runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gateway and Desktop Commander tests
        run: npm test

      - name: Build native macOS release stage
        shell: bash
        run: bash scripts/build-macos-stage.sh
